<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎹 Magic Tiles — Ad Free!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a1a;
      --lane-border: rgba(255,255,255,0.06);
      --accent: #ff2d78;
      --accent2: #6c5ce7;
      --accent3: #00cec9;
      --gold: #fdcb6e;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ── MENU SCREEN ─────────────────────── */
    #menu-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a0a1a 100%);
      z-index: 100;
    }
    #menu-screen.hidden { display: none; }

    .menu-title {
      font-size: 3rem; font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 0.2em;
      text-shadow: none;
      animation: titlePulse 3s ease-in-out infinite;
    }
    @keyframes titlePulse {
      0%,100% { filter: brightness(1); }
      50% { filter: brightness(1.3); }
    }
    .menu-subtitle {
      font-size: 1rem; color: rgba(255,255,255,0.5);
      margin-bottom: 2em; font-weight: 400;
    }

    .song-list {
      width: min(90vw, 420px);
      max-height: 50vh;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px;
      padding: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--accent2) transparent;
    }
    .song-list::-webkit-scrollbar { width: 4px; }
    .song-list::-webkit-scrollbar-thumb { background: var(--accent2); border-radius: 4px; }

    .song-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px 18px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 14px;
    }
    .song-card:hover, .song-card:active {
      background: rgba(255,255,255,0.12);
      border-color: var(--accent);
      transform: scale(1.02);
    }
    .song-card .emoji { font-size: 1.6rem; }
    .song-card .info { flex: 1; }
    .song-card .song-name { font-weight: 700; font-size: 0.95rem; }
    .song-card .song-artist { font-size: 0.75rem; color: rgba(255,255,255,0.45); }
    .song-card .difficulty {
      font-size: 0.65rem; font-weight: 600;
      padding: 3px 8px; border-radius: 20px;
    }
    .diff-easy { background: rgba(0,206,201,0.2); color: var(--accent3); }
    .diff-medium { background: rgba(108,92,231,0.2); color: var(--accent2); }
    .diff-hard { background: rgba(255,45,120,0.2); color: var(--accent); }

    .upload-area {
      width: min(90vw, 420px);
      margin-top: 18px;
      border: 2px dashed rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
    }
    .upload-area:hover {
      border-color: var(--accent3);
      color: var(--accent3);
    }
    .upload-area input { display: none; }

    .high-score-badge {
      margin-top: 18px;
      font-size: 0.8rem;
      color: var(--gold);
      opacity: 0.7;
    }

    /* ── GAME SCREEN ─────────────────────── */
    #game-screen {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column;
      background: var(--bg);
    }
    #game-screen.active { display: flex; }

    .game-header {
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      z-index: 10;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      gap: 12px;
    }
    .game-header .song-info {
      font-size: 0.8rem; font-weight: 600;
      opacity: 0.7;
      flex: 1;
    }
    .game-header .score-display {
      font-size: 1.4rem; font-weight: 900;
      background: linear-gradient(135deg, var(--gold), #f39c12);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .game-header .combo-display {
      font-size: 0.75rem; font-weight: 700;
      color: var(--accent3);
      min-width: 70px; text-align: right;
    }
    .game-header .lives-display {
      display: flex; gap: 4px;
      font-size: 1.2rem;
    }
    .heart { opacity: 1; transition: opacity 0.3s; }
    .heart.lost { opacity: 0.2; }
    .game-header .stars-display {
      display: flex; gap: 2px;
      font-size: 1rem;
    }
    .star { opacity: 0.2; transition: all 0.3s; }
    .star.earned { opacity: 1; transform: scale(1.2); }

    .game-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* lanes */
    .lanes-container {
      position: absolute; inset: 0;
      display: flex;
      z-index: 20;
    }
    .lane {
      flex: 1;
      border-right: 1px solid var(--lane-border);
      position: relative;
      cursor: pointer;
      z-index: 20;
    }
    .lane:last-child { border-right: none; }
    .lane:active {
      background: rgba(255,255,255,0.03);
    }

    /* hit zone */
    .hit-zone {
      position: absolute;
      bottom: 100px;
      left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3), var(--accent));
      background-size: 300% 100%;
      animation: hitZoneGlow 2s linear infinite;
      z-index: 5;
      box-shadow: 0 0 20px rgba(255,45,120,0.4), 0 0 40px rgba(108,92,231,0.2);
      pointer-events: none;
    }
    @keyframes hitZoneGlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* tiles */
    .tile {
      position: absolute;
      width: calc(25% - 6px);
      margin-left: 3px;
      border-radius: 12px;
      transition: none;
      z-index: 2;
      cursor: pointer;
      pointer-events: none;
    }
    .tile.lane-0 { left: 0; }
    .tile.lane-1 { left: 25%; }
    .tile.lane-2 { left: 50%; }
    .tile.lane-3 { left: 75%; }

    .tile-inner {
      width: 100%; height: 100%;
      border-radius: 12px;
      background: linear-gradient(180deg, #2d2d5e 0%, #1a1a3e 100%);
      border: 2px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      font-size: 1.5rem;
    }
    .tile.long .tile-inner {
      background: linear-gradient(180deg, var(--accent2) 0%, #4834d4 100%);
      border: 2px solid rgba(108,92,231,0.5);
    }
    .tile.hit .tile-inner {
      background: linear-gradient(180deg, var(--accent3) 0%, #00b894 100%) !important;
      transform: scale(0.9);
      opacity: 0.6;
    }
    .tile.missed .tile-inner {
      background: linear-gradient(180deg, var(--accent) 0%, #e84393 100%) !important;
      opacity: 0.4;
    }

    /* hit effect */
    .hit-effect {
      position: absolute;
      width: 25%;
      height: 80px;
      bottom: 90px;
      z-index: 8;
      pointer-events: none;
      display: flex; align-items: center; justify-content: center;
      animation: hitPop 0.6s ease-out forwards;
    }
    .hit-effect.lane-0 { left: 0; }
    .hit-effect.lane-1 { left: 25%; }
    .hit-effect.lane-2 { left: 50%; }
    .hit-effect.lane-3 { left: 75%; }

    .hit-text {
      font-weight: 900; font-size: 1.3rem;
      text-shadow: 0 0 30px currentColor;
    }
    .hit-text.perfect { color: var(--gold); }
    .hit-text.great { color: var(--accent3); }
    .hit-text.good { color: var(--accent2); }
    .hit-text.miss { color: var(--accent); }

    @keyframes hitPop {
      0% { transform: scale(0.5) translateY(0); opacity: 1; }
      100% { transform: scale(1.5) translateY(-50px); opacity: 0; }
    }

    /* particles */
    .particle {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 7;
      animation: particleFly 0.7s ease-out forwards;
    }
    @keyframes particleFly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--px), var(--py)) scale(0); opacity: 0; }
    }

    /* back btn */
    .back-btn {
      background: none; border: none; color: #fff;
      font-size: 1.5rem; cursor: pointer;
      padding: 4px 8px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .back-btn:hover { opacity: 1; }

    /* progress bar */
    .progress-bar {
      position: absolute;
      bottom: 0; left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      z-index: 10;
      transition: width 0.3s linear;
      pointer-events: none;
    }

    /* countdown */
    .countdown {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: rgba(10,10,26,0.85);
      z-index: 50;
      font-size: 6rem; font-weight: 900;
      color: var(--gold);
      animation: countPop 0.5s ease-out;
      pointer-events: none;
    }
    .countdown.active { display: flex; }
    @keyframes countPop {
      0% { transform: scale(2); opacity: 0; }
      50% { transform: scale(1); opacity: 1; }
      100% { opacity: 1; }
    }

    /* game over overlay */
    .game-over-overlay {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: rgba(255,45,120,0.15);
      backdrop-filter: blur(10px);
      z-index: 40;
      font-size: 4rem; font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 40px var(--accent);
      animation: gameOverShake 0.5s ease-out;
      pointer-events: none;
    }
    .game-over-overlay.active { display: flex; }
    @keyframes gameOverShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-20px); }
      75% { transform: translateX(20px); }
    }

    /* ── RESULT SCREEN ─────────────────────── */
    #result-screen {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(10,10,26,0.95);
      backdrop-filter: blur(20px);
      z-index: 200;
    }
    #result-screen.active { display: flex; }

    .result-stars {
      font-size: 3rem;
      margin-bottom: 0.3em;
      letter-spacing: 0.2em;
    }

    .result-grade {
      font-size: 5rem; font-weight: 900;
      margin-bottom: 0.1em;
    }
    .grade-s { background: linear-gradient(135deg, var(--gold), #f39c12); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .grade-a { color: var(--accent3); }
    .grade-b { color: var(--accent2); }
    .grade-c { color: rgba(255,255,255,0.5); }
    .grade-f { color: var(--accent); }

    .result-score {
      font-size: 2.5rem; font-weight: 900;
      margin-bottom: 0.3em;
    }
    .result-song {
      font-size: 0.9rem; opacity: 0.5; margin-bottom: 1.5em;
    }

    .result-stats {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 12px; width: min(80vw, 300px);
      margin-bottom: 2em;
    }
    .stat-box {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .stat-value { font-size: 1.3rem; font-weight: 900; }
    .stat-label { font-size: 0.65rem; opacity: 0.4; margin-top: 2px; }

    .result-buttons {
      display: flex; gap: 12px;
    }
    .result-btn {
      padding: 12px 28px;
      border-radius: 30px;
      border: none;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .result-btn:hover { transform: scale(1.05); }
    .btn-retry {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
    }
    .btn-menu {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    /* mobile adjustments */
    @media (max-width: 480px) {
      .menu-title { font-size: 2.2rem; }
      .song-card { padding: 12px 14px; }
      .game-header { height: 50px; padding: 0 10px; font-size: 0.85rem; }
      .hit-zone { bottom: 90px; }
    }
  </style>
</head>
<body>

  <!-- ── MENU ── -->
  <div id="menu-screen">
    <div class="menu-title">🎹 Magic Tiles</div>
    <div class="menu-subtitle">⚡ Ad-Free Edition — Tap Anywhere!</div>

    <div class="song-list" id="song-list"></div>

    <label class="upload-area" id="upload-area">
      📁 Apna Gaana Upload Karo (MP3 / WAV / OGG)
      <input type="file" id="file-input" accept="audio/*" multiple>
    </label>

    <div class="high-score-badge" id="high-score-badge"></div>
  </div>

  <!-- ── GAME ── -->
  <div id="game-screen">
    <div class="game-header">
      <button class="back-btn" id="back-btn">←</button>
      <span class="song-info" id="game-song-info">Song</span>
      <div class="lives-display" id="lives-display">
        <span class="heart">❤️</span>
        <span class="heart">❤️</span>
        <span class="heart">❤️</span>
      </div>
      <div class="stars-display" id="stars-display">
        <span class="star">⭐</span>
        <span class="star">⭐</span>
        <span class="star">⭐</span>
      </div>
      <span class="score-display" id="score-display">0</span>
      <span class="combo-display" id="combo-display"></span>
    </div>
    <div class="game-area" id="game-area">
      <div class="lanes-container" id="lanes-container">
        <div class="lane" data-lane="0"></div>
        <div class="lane" data-lane="1"></div>
        <div class="lane" data-lane="2"></div>
        <div class="lane" data-lane="3"></div>
      </div>
      <div class="hit-zone"></div>
      <div class="progress-bar" id="progress-bar"></div>
      <div class="countdown" id="countdown"></div>
      <div class="game-over-overlay" id="game-over">GAME OVER!</div>
    </div>
  </div>

  <!-- ── RESULT ── -->
  <div id="result-screen">
    <div class="result-stars" id="result-stars"></div>
    <div class="result-grade" id="result-grade"></div>
    <div class="result-score" id="result-score"></div>
    <div class="result-song" id="result-song"></div>
    <div class="result-stats" id="result-stats"></div>
    <div class="result-buttons">
      <button class="result-btn btn-retry" id="btn-retry">🔄 Retry</button>
      <button class="result-btn btn-menu" id="btn-menu">🏠 Menu</button>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════
    //  MAGIC TILES — AD-FREE EDITION V2
    // ═══════════════════════════════════════════

    const SONGS = [
      // Bollywood
      { name: "Tum Hi Ho", artist: "Arijit Singh", emoji: "💕", difficulty: "easy", bpm: 80, file: null, builtin: true },
      { name: "Tera Ban Jaunga", artist: "Akhil & Tulsi", emoji: "🌹", difficulty: "easy", bpm: 85, file: null, builtin: true },
      { name: "Kesariya", artist: "Arijit Singh", emoji: "🧡", difficulty: "medium", bpm: 100, file: null, builtin: true },
      { name: "Apna Bana Le", artist: "Arijit Singh", emoji: "🎵", difficulty: "easy", bpm: 78, file: null, builtin: true },
      { name: "Raataan Lambiyan", artist: "Jubin Nautiyal", emoji: "🌙", difficulty: "medium", bpm: 95, file: null, builtin: true },
      { name: "Excuses", artist: "AP Dhillon", emoji: "🔥", difficulty: "medium", bpm: 110, file: null, builtin: true },
      { name: "Amplifier", artist: "Imran Khan", emoji: "🔊", difficulty: "hard", bpm: 130, file: null, builtin: true },
      { name: "Kar Gayi Chull", artist: "Badshah", emoji: "💃", difficulty: "hard", bpm: 128, file: null, builtin: true },
      // English
      { name: "Shape of You", artist: "Ed Sheeran", emoji: "💎", difficulty: "medium", bpm: 96, file: null, builtin: true },
      { name: "Blinding Lights", artist: "The Weeknd", emoji: "✨", difficulty: "medium", bpm: 171, file: null, builtin: true },
      { name: "Believer", artist: "Imagine Dragons", emoji: "⚡", difficulty: "hard", bpm: 125, file: null, builtin: true },
      { name: "Counting Stars", artist: "OneRepublic", emoji: "⭐", difficulty: "medium", bpm: 122, file: null, builtin: true },
      { name: "Faded", artist: "Alan Walker", emoji: "🌊", difficulty: "easy", bpm: 90, file: null, builtin: true },
      { name: "Starboy", artist: "The Weeknd", emoji: "🌟", difficulty: "hard", bpm: 186, file: null, builtin: true },
    ];

    // ── State ──
    let currentSong = null;
    let audio = null;
    let audioContext = null;
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let perfect = 0, great = 0, good = 0, miss = 0;
    let lives = 3;
    let earnedStars = 0;
    let tiles = [];
    let tileId = 0;
    let gameRunning = false;
    let tileSpeed = 3.5;
    let baseSpeed = 3.5;
    let spawnInterval = null;
    let animFrame = null;
    let hitZoneY = 0;
    let gameAreaHeight = 0;
    let startTime = 0;
    let highScores = JSON.parse(localStorage.getItem('magicTilesHS') || '{}');

    // ── Elements ──
    const menuScreen    = document.getElementById('menu-screen');
    const gameScreen    = document.getElementById('game-screen');
    const resultScreen  = document.getElementById('result-screen');
    const songListEl    = document.getElementById('song-list');
    const gameArea      = document.getElementById('game-area');
    const lanesContainer = document.getElementById('lanes-container');
    const scoreDisplay  = document.getElementById('score-display');
    const comboDisplay  = document.getElementById('combo-display');
    const progressBar   = document.getElementById('progress-bar');
    const countdown     = document.getElementById('countdown');
    const gameOver      = document.getElementById('game-over');
    const gameSongInfo  = document.getElementById('game-song-info');
    const livesDisplay  = document.getElementById('lives-display');
    const starsDisplay  = document.getElementById('stars-display');
    const fileInput     = document.getElementById('file-input');
    const hsBadge       = document.getElementById('high-score-badge');

    // ── Audio Context ──
    // No background music — only actual uploaded songs play

    // ── Resume Audio on First Tap ──
    function resumeAudio() {
      // No-op — audioContext not needed anymore
    }

    // Musical notes
    const NOTES = {
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23,
      G4: 392.00, A4: 440.00, B4: 493.88,
      C5: 523.25, D5: 587.33, E5: 659.26, F5: 698.46,
      G5: 783.99, A5: 880.00, B5: 987.77, C6: 1046.50
    };

    const SCALES = {
      easy:   ['C4','E4','G4','C5','E5','G5'],
      medium: ['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5'],
      hard:   ['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5','A5','B5','C6']
    };

    function playNote(freq, duration = 0.2) {
      if (!audioContext) return;
      try {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + duration);
      } catch(e) { console.log('Audio error:', e); }
    }

    function getRandomNote(difficulty) {
      const scale = SCALES[difficulty] || SCALES.medium;
      const noteName = scale[Math.floor(Math.random() * scale.length)];
      return NOTES[noteName];
    }

    // ── Build Song List ──
    function renderSongList() {
      songListEl.innerHTML = '';
      SONGS.forEach((song, i) => {
        const card = document.createElement('div');
        card.className = 'song-card';
        const hs = highScores[song.name] || 0;
        card.innerHTML = `
          <span class="emoji">${song.emoji}</span>
          <div class="info">
            <div class="song-name">${song.name}</div>
            <div class="song-artist">${song.artist}${hs ? ' — HS: ' + hs : ''}</div>
          </div>
          <span class="difficulty diff-${song.difficulty}">${song.difficulty.toUpperCase()}</span>
        `;
        card.addEventListener('click', () => startGame(i));
        songListEl.appendChild(card);
      });

      const total = Object.values(highScores).reduce((a,b) => a+b, 0);
      hsBadge.textContent = total ? `🏆 Total High Score: ${total}` : '🎹 Tap anywhere on screen to play!';
    }

    // ── File Upload ──
    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).filter(f => f.type.startsWith('audio/'));
      if (files.length === 0) {
        alert('❌ Please select audio files only (MP3, WAV, OGG)');
        return;
      }

      for (const file of files) {
        try {
          const url = URL.createObjectURL(file);
          const name = file.name.replace(/\.[^.]+$/, '');

          // Quick test that audio loads
          const testAudio = new Audio(url);
          await new Promise((resolve, reject) => {
            testAudio.addEventListener('canplaythrough', resolve, { once: true });
            testAudio.addEventListener('error', reject, { once: true });
            testAudio.load();
          });

          SONGS.push({
            name, artist: 'Your Upload', emoji: '🎧',
            difficulty: 'medium', bpm: 120,
            file: url, builtin: false
          });
        } catch (err) {
          alert(`❌ Could not load: ${file.name}`);
          continue;
        }
      }

      renderSongList();
      fileInput.value = ''; // reset input
    });

    // ── Start Game ──
    async function startGame(songIndex) {
      currentSong = SONGS[songIndex];
      score = 0; combo = 0; maxCombo = 0; lives = 3; earnedStars = 0;
      perfect = 0; great = 0; good = 0; miss = 0;
      tiles = []; tileId = 0;

      // speeds
      const speeds = { easy: 3, medium: 4, hard: 5.5 };
      baseSpeed = speeds[currentSong.difficulty] || 4;
      tileSpeed = baseSpeed;

      menuScreen.classList.add('hidden');
      gameScreen.classList.add('active');
      resultScreen.classList.remove('active');

      gameSongInfo.textContent = `${currentSong.emoji} ${currentSong.name}`;
      scoreDisplay.textContent = '0';
      comboDisplay.textContent = '';
      progressBar.style.width = '0%';
      updateLivesDisplay();
      updateStarsDisplay();

      // clear old tiles
      document.querySelectorAll('.tile, .hit-effect, .particle').forEach(e => e.remove());
      gameOver.classList.remove('active');

      // measure
      const rect = gameArea.getBoundingClientRect();
      gameAreaHeight = rect.height;
      hitZoneY = gameAreaHeight - 102;

      // countdown
      countdown.classList.add('active');
      for (let i = 3; i >= 1; i--) {
        countdown.textContent = i;
        countdown.style.animation = 'none';
        countdown.offsetHeight;
        countdown.style.animation = 'countPop 0.5s ease-out';
        await new Promise(r => setTimeout(r, 700));
      }
      countdown.textContent = '🎵';
      await new Promise(r => setTimeout(r, 400));
      countdown.classList.remove('active');

      startTime = Date.now();

      // start audio — ONLY actual uploaded songs play sound
      if (currentSong.file) {
        audio = new Audio(currentSong.file);
        audio.volume = 0.7;
        audio.loop = false;
        audio.addEventListener('ended', endGame);
        audio.addEventListener('error', (e) => {
          console.log('Audio error:', e);
          endGame(); // if audio fails, end game
        });
        audio.play().catch(e => {
          console.log('Audio play error:', e);
          alert('⚠️ Audio blocked by browser. Tap screen first!');
        });
      } else {
        // Built-in songs — NO audio (only user-uploaded songs have sound)
        audio = { _timer: null, currentTime: 0, duration: 60, paused: false };
        const start = Date.now();
        audio._timer = setInterval(() => {
          audio.currentTime = (Date.now() - start) / 1000;
          if (audio.currentTime >= audio.duration) {
            clearInterval(audio._timer);
            endGame();
          }
        }, 100);
      }

      // spawn tiles
      gameRunning = true;
      const bpmMs = 60000 / currentSong.bpm;
      const intervals = { easy: bpmMs * 1.2, medium: bpmMs * 0.8, hard: bpmMs * 0.5 };
      const spawnMs = intervals[currentSong.difficulty] || bpmMs;

      spawnInterval = setInterval(spawnTile, spawnMs);

      // game loop
      function gameLoop() {
        if (!gameRunning) return;
        updateTiles();
        updateProgress();
        updateSpeed();
        animFrame = requestAnimationFrame(gameLoop);
      }
      animFrame = requestAnimationFrame(gameLoop);
    }

    // ── Speed Increase Over Time ──
    function updateSpeed() {
      const elapsed = (Date.now() - startTime) / 1000;
      // Increase 20% every 15 seconds
      const speedMultiplier = 1 + Math.floor(elapsed / 15) * 0.2;
      tileSpeed = baseSpeed * speedMultiplier;
    }

    // ── Spawn Tile ──
    function spawnTile() {
      if (!gameRunning) return;

      const lane = Math.floor(Math.random() * 4);
      const tileH = currentSong.difficulty === 'hard' ? 90 :
                     currentSong.difficulty === 'medium' ? 100 : 110;
      const isLong = Math.random() < 0.1;

      const el = document.createElement('div');
      el.className = `tile lane-${lane}${isLong ? ' long' : ''}`;
      el.innerHTML = '<div class="tile-inner">🎵</div>';
      const finalH = isLong ? tileH * 1.8 : tileH;
      el.style.height = finalH + 'px';
      el.style.top = -finalH + 'px';

      const id = tileId++;
      const tile = {
        id, lane, el, y: -finalH,
        height: finalH,
        hit: false, missed: false,
        note: getRandomNote(currentSong.difficulty)
      };

      tiles.push(tile);
      gameArea.appendChild(el);

      // Click handler for this tile
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        resumeAudio();
        handleTileTap(tile);
      });
    }

    // ── Update Tiles ──
    function updateTiles() {
      for (let i = tiles.length - 1; i >= 0; i--) {
        const t = tiles[i];

        if (t.hit || t.missed) {
          if (t.y > gameAreaHeight + 100) {
            t.el.remove();
            tiles.splice(i, 1);
          } else {
            t.y += tileSpeed;
            t.el.style.top = t.y + 'px';
          }
          continue;
        }

        t.y += tileSpeed;
        t.el.style.top = t.y + 'px';

        // missed — past hit zone
        const tileBottom = t.y + t.height;
        if (t.y > hitZoneY + 40) {
          if (!t.missed) {
            t.missed = true;
            t.el.classList.add('missed');
            miss++;
            loseLife();
            combo = 0;
            comboDisplay.textContent = '';
            showHitEffect(t.lane, 'miss', 'MISS');
          }
        }
      }
    }

    // ── Lives System ──
    function loseLife() {
      lives--;
      updateLivesDisplay();
      if (lives <= 0) {
        triggerGameOver();
      }
    }

    function updateLivesDisplay() {
      const hearts = livesDisplay.querySelectorAll('.heart');
      hearts.forEach((h, i) => {
        if (i < lives) h.classList.remove('lost');
        else h.classList.add('lost');
      });
    }

    function updateStarsDisplay() {
      const stars = starsDisplay.querySelectorAll('.star');
      stars.forEach((s, i) => {
        if (i < earnedStars) s.classList.add('earned');
        else s.classList.remove('earned');
      });
    }

    function calculateStars() {
      const total = perfect + great + good + miss;
      if (total === 0) return 0;
      const accuracy = ((perfect * 100 + great * 75 + good * 50) / (total * 100)) * 100;

      if (accuracy >= 90 && combo >= 20) return 3;
      if (accuracy >= 75) return 2;
      if (accuracy >= 50) return 1;
      return 0;
    }

    // ── Game Over ──
    function triggerGameOver() {
      gameRunning = false;
      gameOver.classList.add('active');
      setTimeout(() => {
        endGame();
      }, 1500);
    }

    // ── Progress ──
    function updateProgress() {
      if (!audio) return;
      const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      progressBar.style.width = pct + '%';

      // Update stars dynamically
      const newStars = calculateStars();
      if (newStars > earnedStars) {
        earnedStars = newStars;
        updateStarsDisplay();
      }
    }

    // ── Lane Click (Full Screen Tap) ──
    lanesContainer.addEventListener('click', (e) => {
      if (!gameRunning) return;
      const lane = parseInt(e.target.dataset.lane);
      if (isNaN(lane)) return;
      handleLaneTap(lane);
    });

    // Handle tile tap directly
    function handleTileTap(tile) {
      if (!gameRunning || tile.hit || tile.missed) return;

      const tileCenter = tile.y + tile.height / 2;
      const dist = Math.abs(tileCenter - hitZoneY);

      if (dist < 100) {
        processHit(tile, dist);
      }
    }

    // Handle lane tap (find closest tile — anywhere on screen!)
    function handleLaneTap(lane) {
      resumeAudio();
      if (!gameRunning) return;

      let best = null;
      let bestDist = Infinity;

      for (const t of tiles) {
        if (t.lane !== lane || t.hit || t.missed) continue;
        const tileCenter = t.y + t.height / 2;
        const dist = Math.abs(tileCenter - hitZoneY);
        if (dist < bestDist) {
          best = t;
          bestDist = dist;
        }
      }

      if (best) {
        processHit(best, bestDist);
      }
    }

    // keyboard
    document.addEventListener('keydown', (e) => {
      if (!gameRunning) return;
      if (e.key === 'Escape') { goToMenu(); return; }
      const map = { d: 0, f: 1, j: 2, k: 3 };
      const lane = map[e.key.toLowerCase()];
      if (lane !== undefined) handleLaneTap(lane);
    });

    function processHit(tile, dist) {
      tile.hit = true;
      tile.el.classList.add('hit');

      // accuracy
      let rating, pts;
      if (dist < 20) { rating = 'perfect'; pts = 100; perfect++; }
      else if (dist < 45) { rating = 'great'; pts = 75; great++; }
      else { rating = 'good'; pts = 50; good++; }

      combo++;
      if (combo > maxCombo) maxCombo = combo;

      const multiplier = Math.min(1 + Math.floor(combo / 10) * 0.5, 4);
      score += Math.round(pts * multiplier);
      scoreDisplay.textContent = score;

      if (combo >= 5) {
        comboDisplay.textContent = `🔥 x${combo}`;
      }

      showHitEffect(tile.lane, rating, rating.toUpperCase());
      spawnParticles(tile.lane);

      // No sound on tile tap — only the uploaded song plays
    }

    function showHitEffect(lane, type, text) {
      const el = document.createElement('div');
      el.className = `hit-effect lane-${lane}`;
      el.innerHTML = `<span class="hit-text ${type}">${text}</span>`;
      gameArea.appendChild(el);
      setTimeout(() => el.remove(), 600);
    }

    function spawnParticles(lane) {
      const colors = ['#ff2d78','#6c5ce7','#00cec9','#fdcb6e','#fff'];
      const laneX = lane * 25 + 12.5;
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = laneX + '%';
        p.style.bottom = '100px';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.setProperty('--px', (Math.random() * 100 - 50) + 'px');
        p.style.setProperty('--py', -(Math.random() * 80 + 30) + 'px');
        gameArea.appendChild(p);
        setTimeout(() => p.remove(), 700);
      }
    }

    // ── End Game ──
    function endGame() {
      gameRunning = false;
      if (spawnInterval) clearInterval(spawnInterval);
      if (animFrame) cancelAnimationFrame(animFrame);
      if (audio) {
        if (audio._timer) clearInterval(audio._timer);
        else if (audio.pause) audio.pause();
      }

      // Calculate final stars
      earnedStars = calculateStars();

      // high score
      const name = currentSong.name;
      if (!highScores[name] || score > highScores[name]) {
        highScores[name] = score;
        localStorage.setItem('magicTilesHS', JSON.stringify(highScores));
      }

      // grade
      const total = perfect + great + good + miss;
      const accuracy = total ? ((perfect * 100 + great * 75 + good * 50) / (total * 100)) * 100 : 0;
      let grade, gradeClass;
      if (accuracy >= 95 && lives > 0) { grade = 'S'; gradeClass = 'grade-s'; }
      else if (accuracy >= 80 && lives > 0) { grade = 'A'; gradeClass = 'grade-a'; }
      else if (accuracy >= 60) { grade = 'B'; gradeClass = 'grade-b'; }
      else if (accuracy >= 40) { grade = 'C'; gradeClass = 'grade-c'; }
      else { grade = 'F'; gradeClass = 'grade-f'; }

      // show result
      gameScreen.classList.remove('active');
      resultScreen.classList.add('active');

      // Stars display
      const starsText = '⭐'.repeat(earnedStars) + '☆'.repeat(3 - earnedStars);
      document.getElementById('result-stars').textContent = starsText;

      document.getElementById('result-grade').className = `result-grade ${gradeClass}`;
      document.getElementById('result-grade').textContent = grade;
      document.getElementById('result-score').textContent = score;
      document.getElementById('result-song').textContent = `${currentSong.emoji} ${currentSong.name} — ${currentSong.artist}`;

      document.getElementById('result-stats').innerHTML = `
        <div class="stat-box"><div class="stat-value" style="color:var(--gold)">${perfect}</div><div class="stat-label">PERFECT</div></div>
        <div class="stat-box"><div class="stat-value" style="color:var(--accent3)">${great}</div><div class="stat-label">GREAT</div></div>
        <div class="stat-box"><div class="stat-value" style="color:var(--accent2)">${good}</div><div class="stat-label">GOOD</div></div>
        <div class="stat-box"><div class="stat-value" style="color:var(--accent)">${miss}</div><div class="stat-label">MISS</div></div>
        <div class="stat-box"><div class="stat-value">🔥 ${maxCombo}</div><div class="stat-label">MAX COMBO</div></div>
        <div class="stat-box"><div class="stat-value">${Math.round(accuracy)}%</div><div class="stat-label">ACCURACY</div></div>
      `;
    }

    // ── Navigation ──
    function goToMenu() {
      gameRunning = false;
      if (spawnInterval) clearInterval(spawnInterval);
      if (animFrame) cancelAnimationFrame(animFrame);
      if (audio) {
        if (audio._timer) clearInterval(audio._timer);
        else if (audio.pause) audio.pause();
      }
      gameScreen.classList.remove('active');
      resultScreen.classList.remove('active');
      menuScreen.classList.remove('hidden');
      document.querySelectorAll('.tile, .hit-effect, .particle').forEach(e => e.remove());
      gameOver.classList.remove('active');
      renderSongList();
    }

    document.getElementById('back-btn').addEventListener('click', goToMenu);
    document.getElementById('btn-menu').addEventListener('click', goToMenu);
    document.getElementById('btn-retry').addEventListener('click', () => {
      resultScreen.classList.remove('active');
      const idx = SONGS.indexOf(currentSong);
      startGame(idx);
    });

    // ── Init ──
    renderSongList();
  </script>
</body>
</html>
